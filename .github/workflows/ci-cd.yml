name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/wprojectsuust/studlenta-api

jobs:
  checks:
    name: стиль · типы · слои
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run lint-imports

  tests:
    name: unit · integration · e2e
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term-missing

  commits:
    name: формат коммитов
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: >
          git log --no-merges --format=%s origin/${{ github.base_ref }}..HEAD
          | python3 scripts/check_commit_message.py --stdin

  image:
    name: образ → GHCR
    needs: [checks, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: деплой → karrad.tech/studlenta
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://karrad.tech/studlenta/api/v1/docs
    concurrency: { group: production, cancel-in-progress: false }
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH-ключ с принудительной командой (ADR-0010)
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Выкатка с автооткатом
        run: |
          printf '%s\n' "${{ secrets.GITHUB_TOKEN }}" \
            | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "deploy ${{ github.sha }}"
      - name: Смоук-проверка прода
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://karrad.tech/studlenta/api/v1/health; then exit 0; fi
            sleep 3
          done
          exit 1
