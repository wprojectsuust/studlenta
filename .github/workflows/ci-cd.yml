name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/wprojectsuust

jobs:
  checks:
    name: стиль · типы · слои
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run lint-imports

  tests:
    name: unit · integration · e2e
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term-missing

  frontend:
    name: фронтенд — линт · типы · unit
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: e2e — Playwright + axe на полном стеке
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      STUDLENTA_DATABASE_URL: postgresql://test:test@localhost:5432/test
      STUDLENTA_JWT_SECRET: e2e-only-secret-0123456789abcdef0123456789
      STUDLENTA_ROOT_PATH: /studlenta
      STUDLENTA_SECURE_COOKIES: "false"
      STUDLENTA_MEDIA_ROOT: /tmp/media
      # Письма в e2e не уходят наружу: API пишет их в файлы, Playwright берёт оттуда ссылку.
      STUDLENTA_MAIL_OUTBOX_DIR: /tmp/studlenta-mail
      STUDLENTA_PUBLIC_URL: http://localhost:3000/studlenta
      E2E_MAIL_OUTBOX: /tmp/studlenta-mail
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with: { enable-cache: true, prune-cache: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: API
        working-directory: backend
        run: |
          uv sync --frozen
          uv run studlenta-migrate
          # Напрямую из .venv, не через `uv run`: фоновый uv держит блокировку кеша, и
          # финальный шаг setup-uv 5 минут ждёт её и падает.
          nohup .venv/bin/uvicorn studlenta.presentation.api.app:create_app --factory \
            --port 8000 --root-path /studlenta > /tmp/api.log 2>&1 &
      - name: Веб (как в проде — standalone)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          PORT=3000 API_INTERNAL_URL=http://localhost:8000 nohup node .next/standalone/server.js > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3000/studlenta/api/v1/health && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - name: Логи и отчёт при падении
        if: failure()
        run: tail -100 /tmp/api.log /tmp/web.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  commits:
    name: формат коммитов
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: >
          git log --no-merges --format=%s origin/${{ github.base_ref }}..HEAD
          | python3 scripts/check_commit_message.py --stdin

  image:
    name: образ ${{ matrix.app }} → GHCR
    needs: [checks, tests, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { app: api, context: backend }
          - { app: web, context: frontend }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/studlenta-${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/studlenta-${{ matrix.app }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: деплой → karrad.tech/studlenta
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://karrad.tech/studlenta
    concurrency: { group: production, cancel-in-progress: false }
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH-ключ с принудительной командой (ADR-0010)
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Выкатка с автооткатом
        run: |
          printf '%s\n' "${{ secrets.GITHUB_TOKEN }}" \
            | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "deploy ${{ github.sha }}"
      - name: Смоук-проверка прода (API и веб)
        run: |
          check() {
            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null -w "%{http_code} $1\n" "$1"; then return 0; fi
              sleep 3
            done
            return 1
          }
          check https://karrad.tech/studlenta/api/v1/health
          check https://karrad.tech/studlenta
