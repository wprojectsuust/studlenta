# Прод на karrad.tech: /opt/studlenta/docker-compose.yml. Образ собирает CI (ADR-0010).
# Лимиты памяти обязательны: на этом же VPS (1 ГБ) работает «База знаний УУНиТ».
name: studlenta

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studlenta
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан в .env}
      POSTGRES_DB: studlenta
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30",
              "-c", "work_mem=2MB", "-c", "maintenance_work_mem=16MB"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studlenta"]
      interval: 5s
      retries: 20
    mem_limit: 192m
    networks: [internal]

  api:
    image: ghcr.io/wprojectsuust/studlenta-api:${RELEASE_TAG:?RELEASE_TAG не задан}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      STUDLENTA_DATABASE_URL: postgresql://studlenta:${DB_PASSWORD}@db:5432/studlenta
      DATABASE_URL: postgresql://studlenta:${DB_PASSWORD}@db:5432/studlenta
      STUDLENTA_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан в .env}
      STUDLENTA_ROOT_PATH: /studlenta
      STUDLENTA_SECURE_COOKIES: "true"
      STUDLENTA_CORS_ORIGINS: https://karrad.tech
      STUDLENTA_MEDIA_ROOT: /app/media
      STUDLENTA_PUBLIC_URL: https://karrad.tech/studlenta
      # Почта (ADR-0012): ящик studlenta@karrad.tech на postfix этого же сервера.
      STUDLENTA_SMTP_HOST: mail.karrad.tech
      STUDLENTA_SMTP_PORT: "587"
      STUDLENTA_SMTP_USERNAME: studlenta@karrad.tech
      STUDLENTA_SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD не задан в .env}
      STUDLENTA_MAIL_FROM: studlenta@karrad.tech
    # mail.karrad.tech внутри контейнера — это хост: письмо идёт в локальный postfix,
    # а имя совпадает с TLS-сертификатом.
    extra_hosts: ["mail.karrad.tech:host-gateway"]
    ports: ["127.0.0.1:5010:8000"]   # наружу — только через nginx
    volumes: [media:/app/media]
    mem_limit: 256m
    networks: [internal]

  web:
    image: ghcr.io/wprojectsuust/studlenta-web:${RELEASE_TAG:?RELEASE_TAG не задан}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_INTERNAL_URL: http://api:8000   # SSR страницы события ходит в API внутри сети compose
      PUBLIC_ORIGIN: https://karrad.tech
    ports: ["127.0.0.1:5011:3000"]   # наружу — только через nginx
    mem_limit: 192m
    networks: [internal]

volumes:
  pgdata:
  media:

networks:
  internal:
