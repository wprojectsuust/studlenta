# Вставляется в server { ... server_name karrad.tech; ... } строкой
#   include /etc/nginx/snippets/studlenta.conf;
#
# /studlenta/api/*, /studlenta/media/* → API (префикс срезается: API живёт на /api/v1, /media);
# остальное под /studlenta → Next.js (basePath=/studlenta, префикс сохраняется).
# Редиректов /studlenta ↔ /studlenta/ здесь нет: их делает Next, иначе будет петля.

location /studlenta/api/ {
    proxy_pass http://127.0.0.1:5010/api/;
    include /etc/nginx/snippets/studlenta-proxy.conf;
    client_max_body_size 6m;
}

location /studlenta/media/ {
    proxy_pass http://127.0.0.1:5010/media/;
    include /etc/nginx/snippets/studlenta-proxy.conf;
    expires 7d;
}

location = /studlenta {
    proxy_pass http://127.0.0.1:5011;
    include /etc/nginx/snippets/studlenta-proxy.conf;
}

location /studlenta/ {
    proxy_pass http://127.0.0.1:5011;
    include /etc/nginx/snippets/studlenta-proxy.conf;
}
