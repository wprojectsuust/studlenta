# Вставляется в server { listen 443 ssl; server_name karrad.tech; ... } существующего сайта.
# Префикс /studlenta срезается (proxy_pass со слэшем); приложение знает его из
# STUDLENTA_ROOT_PATH. Пока нет фронтенда, корень ведёт на Swagger.
location = /studlenta { return 301 /studlenta/; }
location = /studlenta/ { return 302 /studlenta/api/v1/docs; }
location /studlenta/ {
    proxy_pass http://127.0.0.1:5010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Перезаписываем, а не дописываем: иначе клиент подделает IP и обойдёт лимит входа.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;
}
