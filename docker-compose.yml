# Локальная разработка: `docker compose up -d db` — только база;
# `docker compose up --build` — база + API + фронтенд на http://localhost:3000/studlenta
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studlenta
      POSTGRES_PASSWORD: studlenta
      POSTGRES_DB: studlenta
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studlenta"]
      interval: 2s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      STUDLENTA_DATABASE_URL: postgresql://studlenta:studlenta@db:5432/studlenta
      DATABASE_URL: postgresql://studlenta:studlenta@db:5432/studlenta
      STUDLENTA_JWT_SECRET: ${STUDLENTA_JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      STUDLENTA_SECURE_COOKIES: "false"
      STUDLENTA_MEDIA_ROOT: /app/media
      STUDLENTA_ROOT_PATH: /studlenta
      # Без SMTP письма со ссылкой подтверждения печатаются в лог API (docker compose logs api)
    ports: ["8000:8000"]
    volumes: [media:/app/media]

  web:
    build:
      context: ./frontend
      args: { PUBLIC_ORIGIN: "http://localhost:3000" }
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]

volumes:
  pgdata:
  media:
