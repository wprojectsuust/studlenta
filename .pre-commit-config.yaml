# Те же проверки, что в CI, но до коммита. Установка: `make -C backend install`.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + format)
        entry: bash -c 'cd backend && uv run ruff check --fix src tests && uv run ruff format src tests'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy --strict
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: import-linter
        name: границы слоёв (onion)
        entry: bash -c 'cd backend && uv run lint-imports'
        language: system
        files: ^backend/src/.*\.py$
        pass_filenames: false
      - id: unit-tests
        name: юнит-тесты (< 1 c)
        entry: bash -c 'cd backend && uv run pytest tests/unit -q -x'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: conventional-commit
        name: формат сообщения коммита
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
